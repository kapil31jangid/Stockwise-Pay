name: StockWise Pay CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-build:
    name: Full-Stack Verification, Lint, Migrations & Builds
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: stockwise-cryptographic-jwt-secret-key-32-chars-minimum-ci-pipeline-2026
      PAYPAL_CLIENT_ID: mock_paypal_client_id_ci
      PAYPAL_CLIENT_SECRET: mock_paypal_client_secret_ci
      PAYPAL_WEBHOOK_ID: WH-CI-PIPELINE-VERIFIED-2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify lockfiles exist for all modules
        run: |
          test -f package-lock.json || (echo "Missing root package-lock.json" && exit 1)
          test -f backend/package-lock.json || (echo "Missing backend/package-lock.json" && exit 1)
          test -f frontend/package-lock.json || (echo "Missing frontend/package-lock.json" && exit 1)
          test -f intelligence/package-lock.json || (echo "Missing intelligence/package-lock.json" && exit 1)
          test -f supplier-intelligence/package-lock.json || (echo "Missing supplier-intelligence/package-lock.json" && exit 1)
          echo "✅ All lockfiles present"

      - name: Reproducible dependency installation (strict npm ci)
        run: |
          npm ci
          npm --prefix intelligence ci
          npm --prefix supplier-intelligence ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sleep 2

      - name: Validate SQL Schema & Migrations against PostgreSQL (Fresh DB)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stockwise_test
        run: |
          # Create test database
          psql -U postgres -c "CREATE DATABASE stockwise_test;" || true
          # Apply schema with strict error handling
          psql -v ON_ERROR_STOP=1 -U postgres -d stockwise_test -f backend/src/db/schema.sql
          # Apply supabase (seed data)
          psql -v ON_ERROR_STOP=1 -U postgres -d stockwise_test -f backend/src/db/supabase.sql
          # Verify critical tables and constraints on fresh DB
          psql -v ON_ERROR_STOP=1 -U postgres -d stockwise_test -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='users') THEN
                RAISE EXCEPTION 'users table missing';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='products') THEN
                RAISE EXCEPTION 'products table missing';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='suppliers') THEN
                RAISE EXCEPTION 'suppliers table missing';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='purchase_plans') THEN
                RAISE EXCEPTION 'purchase_plans table missing';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='payments') THEN
                RAISE EXCEPTION 'payments table missing';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='capture_attempts') THEN
                RAISE EXCEPTION 'capture_attempts table missing';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='webhook_events') THEN
                RAISE EXCEPTION 'webhook_events table missing';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='revoked_tokens') THEN
                RAISE EXCEPTION 'revoked_tokens table missing';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='budget_config') THEN
                RAISE EXCEPTION 'budget_config table missing';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='plan_versions') THEN
                RAISE EXCEPTION 'plan_versions table missing';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='approvals') THEN
                RAISE EXCEPTION 'approvals table missing';
              END IF;
            END \$\$;

            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.table_constraints
                WHERE table_name='users' AND constraint_name='users_email_key'
              ) THEN
                RAISE EXCEPTION 'users email UNIQUE constraint missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.table_constraints
                WHERE table_name='payments' AND constraint_name='payments_paypal_order_id_key'
              ) THEN
                RAISE EXCEPTION 'payments paypal_order_id UNIQUE constraint missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_indexes WHERE indexname='uq_capture_attempts_active_order'
              ) THEN
                RAISE EXCEPTION 'capture_attempts partial unique index (uq_capture_attempts_active_order) missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.table_constraints
                WHERE table_name='webhook_events' AND constraint_type='PRIMARY KEY' AND constraint_name='webhook_events_pkey'
              ) THEN
                RAISE EXCEPTION 'webhook_events PK on id missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.table_constraints
                WHERE table_name='revoked_tokens' AND constraint_type='PRIMARY KEY'
              ) THEN
                RAISE EXCEPTION 'revoked_tokens PK missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.table_constraints
                WHERE table_name='purchase_plans' AND constraint_name='purchase_plans_created_by_user_id_fkey'
              ) THEN
                RAISE EXCEPTION 'purchase_plans FK to users missing';
              END IF;
            END \$\$;

            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='lease_expires_at'
              ) THEN
                RAISE EXCEPTION 'capture_attempts lease_expires_at column missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='last_heartbeat_at'
              ) THEN
                RAISE EXCEPTION 'capture_attempts last_heartbeat_at column missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='lease_owner'
              ) THEN
                RAISE EXCEPTION 'capture_attempts lease_owner column missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='paypal_request_id'
              ) THEN
                RAISE EXCEPTION 'capture_attempts paypal_request_id column missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_indexes WHERE indexname='idx_capture_attempts_lease_expires'
              ) THEN
                RAISE EXCEPTION 'idx_capture_attempts_lease_expires index missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='purchase_plans' AND column_name='created_by_user_id'
              ) THEN
                RAISE EXCEPTION 'purchase_plans created_by_user_id column missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_indexes WHERE indexname='idx_purchase_plans_created_by'
              ) THEN
                RAISE EXCEPTION 'idx_purchase_plans_created_by index missing';
              END IF;
            END \$\$;
          "
          echo "✅ Fresh PostgreSQL migration validation complete"

      - name: Validate SQL Upgrade Migrations against PostgreSQL (Existing DB with Legacy Fixture)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stockwise_upgrade
        run: |
          # Create upgrade test database
          psql -U postgres -c "CREATE DATABASE stockwise_upgrade;" || true
          # Apply LEGACY schema first (simulate existing DB with old schema and data)
          psql -v ON_ERROR_STOP=1 -U postgres -d stockwise_upgrade -f backend/src/db/legacy_schema.sql
          # Verify legacy state before upgrade
          psql -v ON_ERROR_STOP=1 -U postgres -d stockwise_upgrade -c "
            DO \$\$
            BEGIN
              IF EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='purchase_plans' AND column_name='created_by_user_id'
              ) THEN
                RAISE EXCEPTION 'legacy purchase_plans should NOT have created_by_user_id column';
              END IF;
              IF EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='lease_expires_at'
              ) THEN
                RAISE EXCEPTION 'legacy capture_attempts should NOT have lease_expires_at column';
              END IF;
              IF EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='last_heartbeat_at'
              ) THEN
                RAISE EXCEPTION 'legacy capture_attempts should NOT have last_heartbeat_at column';
              END IF;
              IF EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='lease_owner'
              ) THEN
                RAISE EXCEPTION 'legacy capture_attempts should NOT have lease_owner column';
              END IF;
              IF EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='webhook_events' AND column_name='transmission_id'
              ) THEN
                RAISE EXCEPTION 'legacy webhook_events should NOT have transmission_id column';
              END IF;

              IF (SELECT COUNT(*) FROM users) < 3 THEN
                RAISE EXCEPTION 'legacy seed users count < 3';
              END IF;
              IF (SELECT COUNT(*) FROM purchase_plans) < 1 THEN
                RAISE EXCEPTION 'legacy seed purchase_plans count < 1';
              END IF;
              IF (SELECT COUNT(*) FROM payments) < 1 THEN
                RAISE EXCEPTION 'legacy seed payments count < 1';
              END IF;
            END \$\$;
          "
          echo "✅ Legacy fixture verified"

          # Apply upgrade migrations (schema.sql includes idempotent upgrade migrations)
          psql -v ON_ERROR_STOP=1 -U postgres -d stockwise_upgrade -f backend/src/db/schema.sql
          # Apply supabase.sql (includes seed data and upgrade migrations)
          psql -v ON_ERROR_STOP=1 -U postgres -d stockwise_upgrade -f backend/src/db/supabase.sql

          # Verify post-upgrade state
          psql -v ON_ERROR_STOP=1 -U postgres -d stockwise_upgrade -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='users') THEN
                RAISE EXCEPTION 'users table missing after upgrade';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='purchase_plans') THEN
                RAISE EXCEPTION 'purchase_plans table missing after upgrade';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='capture_attempts') THEN
                RAISE EXCEPTION 'capture_attempts table missing after upgrade';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='webhook_events') THEN
                RAISE EXCEPTION 'webhook_events table missing after upgrade';
              END IF;
            END \$\$;

            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.table_constraints
                WHERE table_name='users' AND constraint_name='users_email_key'
              ) THEN
                RAISE EXCEPTION 'users email UNIQUE constraint missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.table_constraints
                WHERE table_name='payments' AND constraint_name='payments_paypal_order_id_key'
              ) THEN
                RAISE EXCEPTION 'payments paypal_order_id UNIQUE constraint missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_indexes WHERE indexname='uq_capture_attempts_active_order'
              ) THEN
                RAISE EXCEPTION 'capture_attempts partial unique index (uq_capture_attempts_active_order) missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.table_constraints
                WHERE table_name='webhook_events' AND constraint_type='PRIMARY KEY' AND constraint_name='webhook_events_pkey'
              ) THEN
                RAISE EXCEPTION 'webhook_events PK on id missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.table_constraints
                WHERE table_name='revoked_tokens' AND constraint_type='PRIMARY KEY'
              ) THEN
                RAISE EXCEPTION 'revoked_tokens PK missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.table_constraints
                WHERE table_name='purchase_plans' AND constraint_name='purchase_plans_created_by_user_id_fkey'
              ) THEN
                RAISE EXCEPTION 'purchase_plans FK to users missing after upgrade';
              END IF;
            END \$\$;

            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='lease_expires_at'
              ) THEN
                RAISE EXCEPTION 'capture_attempts lease_expires_at column missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='last_heartbeat_at'
              ) THEN
                RAISE EXCEPTION 'capture_attempts last_heartbeat_at column missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='lease_owner'
              ) THEN
                RAISE EXCEPTION 'capture_attempts lease_owner column missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='capture_attempts' AND column_name='paypal_request_id'
              ) THEN
                RAISE EXCEPTION 'capture_attempts paypal_request_id column missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_indexes WHERE indexname='idx_capture_attempts_lease_expires'
              ) THEN
                RAISE EXCEPTION 'idx_capture_attempts_lease_expires index missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='purchase_plans' AND column_name='created_by_user_id'
              ) THEN
                RAISE EXCEPTION 'purchase_plans created_by_user_id column missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_indexes WHERE indexname='idx_purchase_plans_created_by'
              ) THEN
                RAISE EXCEPTION 'idx_purchase_plans_created_by index missing after upgrade';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name='webhook_events' AND column_name='transmission_id'
              ) THEN
                RAISE EXCEPTION 'webhook_events transmission_id column missing after upgrade';
              END IF;
            END \$\$;

            DO \$\$
            BEGIN
              IF (SELECT COUNT(*) FROM users) < 3 THEN
                RAISE EXCEPTION 'seed users lost during upgrade';
              END IF;
              IF (SELECT COUNT(*) FROM purchase_plans) < 1 THEN
                RAISE EXCEPTION 'seed purchase_plans lost during upgrade';
              END IF;
              IF (SELECT COUNT(*) FROM payments) < 1 THEN
                RAISE EXCEPTION 'seed payments lost during upgrade';
              END IF;
              IF (SELECT COUNT(*) FROM products) < 6 THEN
                RAISE EXCEPTION 'seed products lost during upgrade';
              END IF;
              IF (SELECT COUNT(*) FROM suppliers) < 4 THEN
                RAISE EXCEPTION 'seed suppliers lost during upgrade';
              END IF;
              IF (SELECT COUNT(*) FROM supplier_offers) < 14 THEN
                RAISE EXCEPTION 'seed offers lost during upgrade';
              END IF;
              IF (SELECT COUNT(*) FROM purchase_plans WHERE created_by_user_id IS NULL) < 1 THEN
                RAISE EXCEPTION 'legacy purchase_plans should have NULL created_by_user_id';
              END IF;
            END \$\$;
          "
          echo "✅ Upgrade PostgreSQL migration validation complete"

      - name: Frontend Code Quality & Linting
        run: npm --prefix frontend run lint

      - name: Execute Member 2 (Demand Forecasting) Unit Tests
        id: intel-tests
        run: |
          set -euo pipefail
          npm --prefix intelligence test 2>&1 | tee intelligence-test-output.txt
          # Parse test runner summary (tsx --test outputs: "ℹ tests N", "ℹ pass N", "ℹ fail N")
          PASSED=$(grep -E "^\s*ℹ\s+pass\s+" intelligence-test-output.txt | tail -1 | sed -E 's/.*pass\s+([0-9]+).*/\1/' || echo "0")
          FAILED=$(grep -E "^\s*ℹ\s+fail\s+" intelligence-test-output.txt | tail -1 | sed -E 's/.*fail\s+([0-9]+).*/\1/' || echo "0")
          if [ "$FAILED" -gt 0 ] || [ "$PASSED" -eq 0 ]; then
            echo "❌ Intelligence tests failed: $FAILED failures, $PASSED passed"
            exit 1
          fi
          echo "intel_passed=$PASSED" >> $GITHUB_OUTPUT
          echo "intel_failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Execute Member 4 (Supplier Scoring & Budget Optimization) Tests
        id: supplier-tests
        run: |
          set -euo pipefail
          npm --prefix supplier-intelligence test 2>&1 | tee supplier-test-output.txt
          PASSED=$(grep -E "^\s*ℹ\s+pass\s+" supplier-test-output.txt | tail -1 | sed -E 's/.*pass\s+([0-9]+).*/\1/' || echo "0")
          FAILED=$(grep -E "^\s*ℹ\s+fail\s+" supplier-test-output.txt | tail -1 | sed -E 's/.*fail\s+([0-9]+).*/\1/' || echo "0")
          if [ "$FAILED" -gt 0 ] || [ "$PASSED" -eq 0 ]; then
            echo "❌ Supplier Intelligence tests failed: $FAILED failures, $PASSED passed"
            exit 1
          fi
          echo "supplier_passed=$PASSED" >> $GITHUB_OUTPUT
          echo "supplier_failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Execute Member 3 (Backend API, Auth, Database & PayPal) Tests
        id: backend-tests
        run: |
          set -euo pipefail
          npm --prefix backend test 2>&1 | tee backend-test-output.txt
          PASSED=$(grep -E "^\s*ℹ\s+pass\s+" backend-test-output.txt | tail -1 | sed -E 's/.*pass\s+([0-9]+).*/\1/' || echo "0")
          FAILED=$(grep -E "^\s*ℹ\s+fail\s+" backend-test-output.txt | tail -1 | sed -E 's/.*fail\s+([0-9]+).*/\1/' || echo "0")
          if [ "$FAILED" -gt 0 ] || [ "$PASSED" -eq 0 ]; then
            echo "❌ Backend tests failed: $FAILED failures, $PASSED passed"
            exit 1
          fi
          echo "backend_passed=$PASSED" >> $GITHUB_OUTPUT
          echo "backend_failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Build Backend Production Artifact
        run: npm --prefix backend run build

      - name: Build Frontend Next.js Production Artifact
        run: npm --prefix frontend run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

      - name: Dependency Vulnerability Scanning (Fail on Critical)
        run: npm audit --audit-level=critical

      - name: Publish Test & Verification Summary to Step Summary
        if: always()
        run: |
          INTEL_PASSED=${{ steps.intel-tests.outputs.intel_passed || 0 }}
          SUPP_PASSED=${{ steps.supplier-tests.outputs.supplier_passed || 0 }}
          BACK_PASSED=${{ steps.backend-tests.outputs.backend_passed || 0 }}
          if [ "$INTEL_PASSED" = "0" ] || [ "$SUPP_PASSED" = "0" ] || [ "$BACK_PASSED" = "0" ]; then
            echo "⚠️ Warning: Test counts not available from previous steps"
          fi
          echo "### StockWise Pay CI Pipeline Results 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Demand Forecasting (Intelligence)**: ${INTEL_PASSED} Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Supplier & Budget Optimization**: ${SUPP_PASSED} Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API, Security & PayPal**: ${BACK_PASSED} Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Database Migration Schema**: Validated against PostgreSQL (Fresh & Upgrade)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Linting & Next.js Build**: Completed Cleanly" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend TypeScript Build**: Completed Cleanly" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Vulnerability Scan**: Critical-level blocking" >> $GITHUB_STEP_SUMMARY
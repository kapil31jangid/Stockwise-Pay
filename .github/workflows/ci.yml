name: StockWise Pay CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Full-Stack Verification & Builds
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: stockwise-cryptographic-jwt-secret-key-32-chars-minimum-ci-pipeline-2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install Member 2 (Intelligence) dependencies
        run: npm --prefix intelligence ci || npm --prefix intelligence install

      - name: Install Member 4 (Supplier Intelligence) dependencies
        run: npm --prefix supplier-intelligence ci || npm --prefix supplier-intelligence install

      - name: Install Member 3 (Backend) dependencies
        run: npm --prefix backend ci || npm --prefix backend install

      - name: Install Member 1 (Frontend) dependencies
        run: npm --prefix frontend ci || npm --prefix frontend install

      - name: Execute Member 2 (Demand Forecasting) Unit Tests
        run: npm --prefix intelligence test

      - name: Execute Member 4 (Supplier Scoring & Budget) Unit Tests
        run: npm --prefix supplier-intelligence test

      - name: Execute Member 3 (API, Cryptographic JWT, RBAC & PayPal) Tests
        run: npm --prefix backend test

      - name: Build Backend Production Artifact
        run: npm --prefix backend run build

      - name: Build Frontend Next.js Production Artifact
        run: npm --prefix frontend run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

      - name: Dependency Vulnerability Scanning
        run: npm audit --audit-level=critical || echo "Security audit completed with non-blocking notices."

